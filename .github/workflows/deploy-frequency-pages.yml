name: Deploy frequency calculator to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frecuencias/**"
      - ".github/workflows/deploy-frequency-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: frecuencias

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
